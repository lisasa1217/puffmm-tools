<!--
==========================================================
  泡芙與媽 工具箱 — 首頁（給 Claude 讀的部署說明）
==========================================================
這是「工作工具系統」的入口首頁，跟 puffmm-tools 這個 repo 下的
其他 .html 檔案（labor-form.html、shorturl.html）是同一個 Vercel
專案的不同頁面，靠 vercel.json 的 cleanUrls 讓網址可以是
/labor-form、/shorturl（不用打 .html）。

短網址功能（shorturl.html）額外需要一個 Supabase 專案：
  - 資料表 short_links (code text primary key, url text, created_at, clicks)
  - shorturl.html 檔案開頭有 SUPABASE_URL / SUPABASE_ANON_KEY 兩個常數要填
  - 短碼被打開時（例如 /abc123），vercel.json 會把它 rewrite 回這個
    index.html，靠下面 <script> 判斷網址路徑不是已知頁面時，
    去 Supabase 查短碼、找到就跳轉過去。

密碼保護沿用 labor-form.html 同一套（localStorage: lbs_pw，
sessionStorage: lbs_auth），因為同源，所有頁面共用同一個密碼。
==========================================================
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡芙與媽 工具箱</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #fffae0;
    --surface: #ffffff;
    --surface2: #fff5c8;
    --border: #f0d96e;
    --accent: #1e5929;
    --accent2: #fbcd2c;
    --text: #1a2e10;
    --muted: #7a8c3a;
    --danger: #e05555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(30,89,41,0.4);
  }
  header h1 {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  header span {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-left: auto;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 61px);
  }
  .cat-nav {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
  }
  .cat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding-left: 8px;
  }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }

  .main { padding: 36px 40px; }
  .main h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .main .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(30,89,41,0.12);
  }
  .card .icon {
    width: 42px; height: 42px;
    border-radius: 11px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .card h3 { font-size: 15px; font-weight: 700; }
  .card p { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .card .go {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    display: flex; align-items: center; gap: 4px;
  }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .cat-nav { border-right: none; border-bottom: 1px solid var(--border); display:flex; gap:8px; padding:14px 16px; overflow-x:auto; }
    .cat-label { display:none; }
    .cat-btn { width:auto; white-space:nowrap; }
    .main { padding: 24px 18px; }
  }
</style>
</head>
<body>

<div id="pwGate" style="position:fixed;inset:0;z-index:99999;background:#e8e8e8;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',sans-serif;">
  <div style="background:#fff;border-radius:16px;padding:40px 32px 32px;box-shadow:0 4px 32px rgba(0,0,0,0.12);width:90%;max-width:340px;text-align:center;border-top:4px solid #fbcd2c;">
    <div style="width:44px;height:44px;background:#1e5929;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbcd2c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px;">泡芙與媽 工具箱</div>
    <div style="font-size:13px;color:#999;margin-bottom:24px;">請輸入密碼以繼續</div>
    <div style="position:relative;margin-bottom:8px;">
      <input id="pwInput" type="password" placeholder="輸入密碼" autocomplete="current-password"
        style="width:100%;box-sizing:border-box;padding:12px 44px 12px 16px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none;background:#fafafa;color:#1a1a1a;font-family:'Noto Sans TC',sans-serif;transition:border-color 0.2s;"
        onkeydown="if(event.key==='Enter')checkPw()"
        onfocus="this.style.borderColor='#1e5929'" onblur="this.style.borderColor='#ddd'">
      <button id="pwEyeBtn" onclick="togglePwEye()" type="button"
        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;line-height:1;touch-action:manipulation;">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div id="pwErr" style="font-size:12px;color:#e05555;min-height:18px;margin-bottom:10px;text-align:left;padding-left:2px;"></div>
    <button onclick="checkPw()"
      style="width:100%;padding:13px;background:#1e5929;color:#fbcd2c;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.04em;transition:background 0.15s;"
      onmouseover="this.style.background='#174d22'" onmouseout="this.style.background='#1e5929'">
      進入
    </button>
  </div>
</div>

<script>
(function(){
  const TITLE   = document.querySelector('#pwGate [style*="font-size:18px"]');
  const HINT    = document.querySelector('#pwGate [style*="font-size:13px"][style*="color:#999"]');
  const SUBMIT  = document.querySelector('#pwGate button[onclick="checkPw()"]');

  function unlock(){
    sessionStorage.setItem('lbs_auth','1');
    document.getElementById('pwGate').style.display='none';
  }

  if(sessionStorage.getItem('lbs_auth')==='1'){ unlock(); return; }

  const savedPw = localStorage.getItem('lbs_pw');

  if(!savedPw){
    if(HINT)    HINT.textContent = '第一次使用，請設定你的密碼';
    if(SUBMIT)  SUBMIT.textContent = '設定密碼';
    window.checkPw = function(){
      const v = document.getElementById('pwInput').value.trim();
      if(v.length < 3){
        document.getElementById('pwErr').textContent = '密碼至少 3 個字元';
        return;
      }
      localStorage.setItem('lbs_pw', v.toLowerCase());
      unlock();
    };
  } else {
    if(HINT)    HINT.textContent = '請輸入密碼以繼續';
    if(SUBMIT)  SUBMIT.textContent = '進入';
    window.checkPw = function(){
      const v = document.getElementById('pwInput').value.toLowerCase().trim();
      if(v === savedPw){
        unlock();
      } else {
        document.getElementById('pwErr').textContent = '密碼錯誤，請再試一次';
        document.getElementById('pwInput').value = '';
        document.getElementById('pwInput').focus();
      }
    };
  }

  window.togglePwEye = function(){
    const inp = document.getElementById('pwInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    document.getElementById('pwEyeBtn').querySelector('svg').style.stroke = inp.type === 'text' ? '#1e5929' : '#aaa';
  };
})();
</script>

<div id="hubRoot">
  <header>
    <div class="logo-dot"></div>
    <h1>泡芙與媽 工具箱</h1>
    <span>v1.0 · 個人工作小工具</span>
  </header>

  <div class="layout">
    <nav class="cat-nav">
      <div class="cat-label">分類</div>
      <button class="cat-btn">🛠 工具</button>
    </nav>

    <main class="main">
      <h2>🛠 工具</h2>
      <div class="sub">目前有這些小工具，點卡片進入</div>
      <div class="cards">
        <a class="card" href="/labor-form">
          <div class="icon">📋</div>
          <h3>勞報單填寫助手</h3>
          <p>上傳廠商給的勞報單（PDF / Word / Excel），自動帶入你的個人資料、身分證、存摺、簽名，填好直接下載或傳 LINE。</p>
          <div class="go">開啟工具 →</div>
        </a>
        <a class="card" href="/shorturl">
          <div class="icon">🔗</div>
          <h3>縮短網址產生器</h3>
          <p>貼上一長串網址，產生一個好記、好分享的短連結，點開會自動跳轉回原始網址。</p>
          <div class="go">開啟工具 →</div>
        </a>
      </div>
    </main>
  </div>
</div>

<!--
  短碼跳轉：如果網址路徑不是「/」也不是已知頁面（labor-form、shorturl），
  就當作是短網址代碼，去 Supabase 查詢並跳轉。
  ⚠️ 這裡的 SUPABASE_URL / SUPABASE_ANON_KEY 要填好之後這段才會動。
-->
<script>
(async function(){
  const SUPABASE_URL = 'https://nkoclwpfugtaepwpgnwl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rb2Nsd3BmdWd0YWVwd3BnbndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjI2ODMsImV4cCI6MjEwNTE5ODY4M30.u94y7QHG7MalAghzF4lp40X9IIuHgMxoMncg1Zhx32w';

  const path = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
  const KNOWN_PAGES = ['', 'labor-form', 'shorturl', 'index'];
  if (KNOWN_PAGES.includes(path)) return; // normal hub page, do nothing

  if (SUPABASE_URL.startsWith('PLACEHOLDER')) return; // not configured yet

  // Hide hub, show a small "跳轉中" state while we look the code up
  document.getElementById('hubRoot').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:'Noto Sans TC',sans-serif;color:#1a2e10;">
      <div style="font-size:15px;">🔗 跳轉中…</div>
    </div>`;

  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.from('short_links').select('url, clicks').eq('code', path).single();
    if (error || !data) throw new Error('not found');
    sb.from('short_links').update({ clicks: (data.clicks || 0) + 1 }).eq('code', path); // best-effort click count, not awaited
    location.replace(data.url);
  } catch (e) {
    document.getElementById('hubRoot').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:'Noto Sans TC',sans-serif;color:#1a2e10;text-align:center;padding:20px;">
        <div style="font-size:32px;">🔍</div>
        <div style="font-size:15px;font-weight:700;">找不到這個短網址</div>
        <div style="font-size:13px;color:#7a8c3a;">代碼「${path}」不存在，或已經被刪除</div>
        <a href="/" style="margin-top:10px;font-size:13px;color:#1e5929;font-weight:700;">回工具箱首頁</a>
      </div>`;
  }
})();
</script>

</body>
</html>
